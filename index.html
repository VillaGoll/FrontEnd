<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VillaGol</title>
    <style>
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.65);
        transition: opacity 0.4s ease-out;
      }
      #app-loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader .ball {
        width: 72px;
        height: 72px;
        animation: roll 1.2s linear infinite;
      }
      #app-loader .text {
        color: #fff;
        font-family: Roboto, sans-serif;
        font-size: 0.95rem;
        font-weight: 500;
        letter-spacing: 3px;
        text-transform: uppercase;
        opacity: 0.85;
        margin-top: 20px;
      }
      #app-loader .dots {
        display: flex;
        gap: 5px;
        margin-top: 12px;
      }
      #app-loader .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        animation: dotPulse 1.4s ease-in-out infinite;
      }
      #app-loader .dot:nth-child(2) { animation-delay: 0.25s; }
      #app-loader .dot:nth-child(3) { animation-delay: 0.5s; }
      @keyframes roll {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.15); }
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <svg class="ball" viewBox="0 0 194 194" xmlns="http://www.w3.org/2000/svg">
        <circle fill="#1a1a1a" cx="97" cy="97" r="97" />
        <path fill="#ffffff" d="m 94,9.2 a 88,88 0 0 0 -55,21.8 l 27,0 28,-14.4 0,-7.4 z m 6,0 0,7.4 28,14.4 27,0 a 88,88 0 0 0 -55,-21.8 z m -67.2,27.8 a 88,88 0 0 0 -20,34.2 l 16,27.6 23,-3.6 21,-36.2 -8.4,-22 -31.6,0 z m 96.8,0 -8.4,22 21,36.2 23,3.6 15.8,-27.4 a 88,88 0 0 0 -19.8,-34.4 l -31.6,0 z m -50,26 -20.2,35.2 17.8,30.8 39.6,0 17.8,-30.8 -20.2,-35.2 -34.8,0 z m -68.8,16.6 a 88,88 0 0 0 -1.8,17.4 88,88 0 0 0 10.4,41.4 l 7.4,-4.4 -1.4,-29 -14.6,-25.4 z m 172.4,0.2 -14.6,25.2 -1.4,29 7.4,4.4 a 88,88 0 0 0 10.4,-41.4 88,88 0 0 0 -1.8,-17.2 z m -106,57.2 -15.4,19 L 77.2,182.6 a 88,88 0 0 0 19.8,2.4 88,88 0 0 0 19.8,-2.4 l 15.4,-26.6 -15.4,-19 -39.6,0 z m -47.8,2.6 -7,4 A 88,88 0 0 0 68.8,180.4 l -14,-24.6 -25.4,-16.2 z m 135.2,0 -25.4,16.2 -14,24.4 a 88,88 0 0 0 46.4,-36.6 l -7,-4 z" />
      </svg>
      <div class="text">Cargando</div>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        var loader = document.getElementById('app-loader');
        if (loader) {
          loader.classList.add('hide');
          setTimeout(function() { loader.remove(); }, 500);
        }
      });
    </script>
  </body>
</html>
